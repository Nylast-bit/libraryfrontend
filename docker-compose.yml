services:
  api:
    build: .
    container_name: library-api
    ports:
      - "5053:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development   # habilita /scalar y evita la redirección a HTTPS
      FakeRestApi__BaseUrl: https://fakerestapi.azurewebsites.net/

  web:
    build:
      context: ../libraryfrontend
      args:
        # El navegador del usuario es quien llama a la API, por eso es localhost y no "api"
        NEXT_PUBLIC_API_URL: http://localhost:5053
    container_name: library-web
    ports:
      - "3000:3000"
    depends_on:
      - api